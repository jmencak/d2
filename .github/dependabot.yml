# Notes:
# - The schedule only governs version updates. Security updates are opened when
#   a GitHub Advisory is published, independently of "weekly".
# - Dependabot skips modules covered by a `replace` directive.
# - This configuration does not block any security updates.  Even for dependencies
#   that we intend to keep version locked.  If such a case arises, the issue will be
#   resolved manually.

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "00:42"
      timezone: "Europe/Prague"
    # Include indirect dependencies so the k8s patch group can move the whole
    # k8s staging set (apiserver, component-base, kube-aggregator, ...) together.
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sigs.k8s.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # OpenShift dependencies on pseudo-versions (v0.0.0-<date>-<hash>).
      # Dependabot only updates a pseudo-version to a tagged release, and
      # these modules do not publish release tags, so they cannot be bumped
      # automatically.  Ignore them and move manually with the OpenShift
      # payload.
      - dependency-name: "github.com/openshift/api"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "github.com/openshift/build-machinery-go"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "github.com/openshift/client-go"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "github.com/openshift/controller-runtime-common"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "github.com/openshift/hypershift/api"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "github.com/openshift/library-go"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # openshift-tests-extension must move together with the ginkgo replace
      # in go.mod, so never update it automatically either.
      - dependency-name: "github.com/openshift-eng/openshift-tests-extension"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # Tagged OpenShift dependency: conservative, patches only, like the
      # openshift-kni modules below.
      - dependency-name: "github.com/openshift/custom-resource-status"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "github.com/openshift-kni/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # PR-aggregation filter.  Group updates to reduce PR noise.  First matching group wins.
    groups:
      # Kubernetes/OpenShift updates.
      kubernetes-ecosystem:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/openshift/*"
          - "github.com/openshift-eng/*"
          - "github.com/openshift-kni/*"
      # Everything else: minor and patch updates batched into one PR.
      catch-all:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    # Reviewers are auto-assigned by Prow.  Set 'jmencak' as assignee for tracking.
    assignees:
      - "jmencak"
    commit-message:
      prefix: "NO-JIRA: chore(deps)"
