# Notes:
# - The schedule only governs version updates. Security updates are opened when
#   a GitHub Advisory is published, independently of "weekly".
# - Dependabot skips modules covered by a `replace` directive.
# - `ignore` with `update-types` blocks routine version bumps but still allows
#   security updates.  Omitting `update-types` would suppress security too.

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:42"
      timezone: "Europe/Prague"
    labels:
      - "ok-to-test"
    # Include indirect dependencies so the k8s patch group can move the whole
    # k8s staging set (apiserver, component-base, kube-aggregator, ...) together.
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # Ignore k8s ecosystem and openshift-kni minor/major updates (only allow patches).
    # These dependencies have breaking API changes even in minor versions.
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "sigs.k8s.io/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "github.com/openshift/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "github.com/openshift-kni/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # PR-aggregation filter.  Group updates to reduce PR noise.  First matching group wins.
    groups:
      # Kubernetes/OpenShift updates.  Be conservative, patches only.
      k8s-ecosystem:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/openshift/*"
          - "github.com/openshift-kni/*"
      # Everything else: minor and patch updates batched into one PR.
      catch-all:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    # Reviewers are auto-assigned by Prow.  Set 'jmencak' as assignee for tracking.
    assignees:
      - "jmencak"
    commit-message:
      prefix: "chore(deps)"
    # Rebase strategy: auto-rebase PRs when base branch is updated
    rebase-strategy: "auto"
